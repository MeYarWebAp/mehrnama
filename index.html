<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مهرنما - تصویرِ شفافِ مهربانی</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            direction: rtl;
        }
        header {
            text-align: center;
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .project-card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .project-card h2 {
            margin-top: 0;
            color: #2980b9;
        }
        .charity-name {
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 10px;
        }
        .media-container img, .media-container video {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>مهرنما - </h1>
        <p>تصویرِ شفافِ مهربانی</p>
    </header>

    <div class="container" id="projects-container">
        <p style="text-align: center;">در حال بارگذاری پروژه‌ها...</p>
    </div>

    <script>
        // دریافت لیست پروژه‌ها از API سرور و نمایش در صفحه
        async function fetchProjects() {
            try {
                const response = await fetch('/api/projects');
                const projects = await response.json();
                
                const container = document.getElementById('projects-container');
                container.innerHTML = '';

                if (projects.length === 0) {
                    container.innerHTML = '<p style="text-align: center;">هنوز پروژه‌ای ثبت نشده است.</p>';
                    return;
                }

                projects.forEach(project => {
                    const card = document.createElement('div');
                    card.className = 'project-card';

                    // تشخیص اینکه فایل عکس است یا ویدیو
                    let mediaElement = '';
                    if (project.file_path.endsWith('.mp4') || project.file_path.endsWith('.webm')) {
                        mediaElement = `<video controls src="${project.file_path}"></video>`;
                    } else {
                        mediaElement = `<img src="${project.file_path}" alt="مستندات پروژه">`;
                    }

                    card.innerHTML = `
                        <h2>${project.title}</h2>
                        <div class="charity-name">توسط خیریه: <strong>${project.charity_name}</strong></div>
                        <p>${project.description}</p>
                        <div class="media-container">
                            ${mediaElement}
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                console.error('Error fetching projects:', err);
                document.getElementById('projects-container').innerHTML = '<p style="text-align: center; color: red;">خطا در بارگذاری پروژه‌ها.</p>';
            }
        }

        fetchProjects();
    </script>

</body>
</html>
