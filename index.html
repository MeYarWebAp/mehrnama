<script>
        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('v');
        const charityId = urlParams.get('charity_id');

        function isVideo(filePath) {
            if (!filePath) return false;
            const ext = filePath.toLowerCase();
            return ext.endsWith('.mp4') || ext.endsWith('.webm') || ext.endsWith('.ogg') || ext.endsWith('.mov');
        }

        // صفحه اصلی (خانه)
        async function loadHome() {
            const container = document.getElementById('main-content');
            container.innerHTML = `
                <div class="section-title">ویدیوهای منتخب و اخیر</div>
                <div class="video-grid" id="video-container"><p>در حال بارگذاری...</p></div>
            `;

            try {
                const response = await fetch('/api/projects');
                const projects = await response.json();
                const videoContainer = document.getElementById('video-container');
                videoContainer.innerHTML = '';

                if (projects.length === 0) {
                    videoContainer.innerHTML = '<p>هنوز آیتمی ثبت نشده است.</p>';
                    return;
                }

                projects.forEach(project => {
                    const card = document.createElement('div');
                    card.className = 'video-card';
                    card.onclick = () => { window.location.href = `/?v=${project.id}`; };

                    let mediaHtml = isVideo(project.file_path)
                        ? `<div class="media-box"><video src="${project.file_path}"></video></div>`
                        : `<div class="media-box"><img src="${project.file_path}" alt="پروژه" onerror="this.src='https://via.placeholder.com/300x180/eef2f5/999999?text=Mehrnama';"></div>`;

                    card.innerHTML = `
                        ${mediaHtml}
                        <div class="video-info">
                            <div class="video-title">${project.title}</div>
                            <div class="channel-link" onclick="event.stopPropagation(); window.location.href='/?charity_id=${project.charity_id}'">کانال: ${project.charity_name}</div>
                            <div class="video-desc">${project.description}</div>
                        </div>
                    `;
                    videoContainer.appendChild(card);
                });
            } catch (err) {
                console.error('Error:', err);
            }
        }

        // صفحه کانال خیریه
        async function loadChannel(id) {
            const container = document.getElementById('main-content');
            container.innerHTML = `<p>در حال بارگذاری اطلاعات کانال...</p>`;

            try {
                const response = await fetch(`/api/charities/${id}/projects`);
                const data = await response.json();

                if (response.status !== 200) {
                    container.innerHTML = `<p>${data.error || 'خطا در بارگذاری کانال'}</p>`;
                    return;
                }

                container.innerHTML = `
                    <div class="channel-header">
                        <h2>کانال: ${data.charity.name}</h2>
                        <p>ایمیل ارتباطی: ${data.charity.email} | تلفن: ${data.charity.phone || 'ثبت نشده'}</p>
                    </div>
                    <div class="section-title">ویدیوها و پروژه‌های این کانال</div>
                    <div class="video-grid" id="channel-videos"></div>
                `;

                const videoContainer = document.getElementById('channel-videos');
                if (data.projects.length === 0) {
                    videoContainer.innerHTML = '<p>این کانال هنوز موردی آپلود نکرده است.</p>';
                    return;
                }

                data.projects.forEach(project => {
                    const card = document.createElement('div');
                    card.className = 'video-card';
                    card.onclick = () => { window.location.href = `/?v=${project.id}`; };

                    let mediaHtml = isVideo(project.file_path)
                        ? `<div class="media-box"><video src="${project.file_path}"></video></div>`
                        : `<div class="media-box"><img src="${project.file_path}" alt="پروژه" onerror="this.src='https://via.placeholder.com/300x180/eef2f5/999999?text=Mehrnama';"></div>`;

                    card.innerHTML = `
                        ${mediaHtml}
                        <div class="video-info">
                            <div class="video-title">${project.title}</div>
                            <div class="video-desc">${project.description}</div>
                        </div>
                    `;
                    videoContainer.appendChild(card);
                });

            } catch (err) {
                console.error('Error loading channel:', err);
                container.innerHTML = '<p>خطا در ارتباط با سرور.</p>';
            }
        }

        // صفحه تماشای ویدیو و کامنت‌ها (Watch Page)
        async function loadWatchPage(id) {
            const container = document.getElementById('main-content');
            container.innerHTML = `<p>در حال بارگذاری ویدیو...</p>`;

            try {
                const response = await fetch('/api/projects');
                const projects = await response.json();
                const project = projects.find(p => p.id == id);

                if (!project) {
                    container.innerHTML = `<p>ویدیو مورد نظر یافت نشد.</p>`;
                    return;
                }

                let mediaHtml = isVideo(project.file_path)
                    ? `<div class="watch-media"><video controls autoplay src="${project.file_path}"></video></div>`
                    : `<div class="watch-media"><img src="${project.file_path}" alt="پروژه"></div>`;

                container.innerHTML = `
                    <div class="watch-container">
                        ${mediaHtml}
                        <div class="watch-title">${project.title}</div>
                        <div class="channel-link" style="margin-bottom: 15px; cursor: pointer;" onclick="window.location.href='/?charity_id=${project.charity_id}'">کانال: ${project.charity_name}</div>
                        <div class="watch-desc">${project.description}</div>

                        <div class="comments-section">
                            <h3>نظرات کاربران</h3>
                            <div class="comment-form">
                                <input type="text" id="authorName" placeholder="نام شما">
                                <textarea id="commentText" rows="3" placeholder="نظر خود را درباره این ویدیو بنویسید..."></textarea>
                                <button onclick="postComment(${project.id})">ارسال نظر</button>
                            </div>
                            <div id="commentsList"><p>در حال بارگذاری نظرات...</p></div>
                        </div>
                    </div>
                `;

                loadComments(project.id);
            } catch (err) {
                console.error('Error loading watch page:', err);
            }
        }

        async function loadComments(projectId) {
            try {
                const res = await fetch(`/api/projects/${projectId}/comments`);
                const comments = await res.json();
                const list = document.getElementById('commentsList');
                list.innerHTML = '';

                if (comments.length === 0) {
                    list.innerHTML = '<p style="color: #778; font-size: 14px;">هنوز نظری ثبت نشده است. اولین نفر باشید که نظر می‌دهد!</p>';
                    return;
                }

                comments.forEach(c => {
                    const div = document.createElement('div');
                    div.className = 'comment-card';
                    div.innerHTML = `
                        <div class="comment-author">${c.author_name}</div>
                        <div class="comment-text">${c.comment_text}</div>
                    `;
                    list.appendChild(div);
                });
            } catch (err) {
                console.error('Error loading comments:', err);
            }
        }

        async function postComment(projectId) {
            const authorName = document.getElementById('authorName').value.trim();
            const commentText = document.getElementById('commentText').value.trim();

            if (!authorName || !commentText) {
                alert('لطفاً نام و متن نظر را وارد کنید.');
                return;
            }

            try {
                const res = await fetch(`/api/projects/${projectId}/comments`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ author_name: authorName, comment_text: commentText })
                });

                if (res.ok) {
                    document.getElementById('authorName').value = '';
                    document.getElementById('commentText').value = '';
                    loadComments(projectId);
                } else {
                    alert('خطا در ثبت نظر.');
                }
            } catch (err) {
                console.error('Error posting comment:', err);
            }
        }

        // مسیریابی دقیق
        if (videoId) {
            loadWatchPage(videoId);
        } else if (charityId) {
            loadChannel(charityId);
        } else {
            loadHome();
        }
    </script>
